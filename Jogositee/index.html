<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clica no Yami!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>⚔️ Clica no ninja!</h1>

    <div id="hud">
        <div class="hud-item">
            <span class="hud-label">PONTOS</span>
            <span class="hud-valor" id="pontos">0</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">TEMPO</span>
            <span class="hud-valor" id="tempo">15</span>
        </div>
    </div>

    <button id="btnIniciar" onclick="iniciarJogo()">▶ INICIAR</button>
    <div id="arena"></div>
    <div id="telafim">
        <h2>☠ FIM DE JOGO ☠</h2>
        <p>Sua pontuação final:</p>
        <span id="pontosFinal">0</span>
        <button onclick="fecharFim()">↺ Jogar de Novo</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
